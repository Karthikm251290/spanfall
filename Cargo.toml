[package]
name = "spanfall"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A local-first OTLP trace viewer, linter, and exporter."

[features]
# Only for scripts/release-panic-smoke.sh: gates a reachable panic() in convert() behind a
# sentinel span name, so the smoke script can actually exercise the catch_unwind boundary against
# a real --release binary instead of asserting on inputs that never reach it. Absent from a normal
# build.
panic-injection = []

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive"] }
opentelemetry-proto = { version = "0.32.0", default-features = false, features = ["trace", "gen-tonic", "with-serde"] }
parking_lot = "0.12.5"
prost = "=0.14.4"
rust-embed = "8.12.0"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tonic = { version = "=0.14.6", features = ["transport"] }
tower-http = { version = "0.7.1", features = ["compression-gzip", "fs"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
panic = "unwind"
